# En-têtes de sécurité et de cache du portail pro.glsc.fr.
# À inclure UNE FOIS dans le bloc « server » du site (deploy.sh le fait au premier lancement) :
#
#     include snippets/pro-security.conf;
#
# Aucune page n'appelle de service tiers : polices, styles et scripts sont hébergés sur le site.

expires -1;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

gzip on;
gzip_types text/css text/javascript image/svg+xml;

location ~* \.(woff2|png|svg|ico)$ { expires off; add_header Cache-Control "public, max-age=2592000" always; add_header X-Content-Type-Options "nosniff" always; add_header X-Robots-Tag "noindex, nofollow" always; }
location ~* \.(css|js)$ { expires off; add_header Cache-Control "public, max-age=300, must-revalidate" always; add_header X-Content-Type-Options "nosniff" always; add_header X-Robots-Tag "noindex, nofollow" always; }
